<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayar QRIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  .hdr-bg { position: absolute; left: 0; right: 0; top: 0; height: 290px; background: var(--ink); }
  .wrap { position: relative; display: flex; flex-direction: column; min-height: 100dvh; }
  .qr-card { position: relative; margin: 22px 20px 0; background: #fff; border-radius: 32px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 20px 40px rgba(17,19,17,.12); }
  .qr-box { width: 225px; height: 225px; }
  .qr-box img { width: 100%; height: 100%; display: block; }
  .steps { padding: 20px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .step { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 18px; background: #fff; border: 1px solid var(--line); font-size: 12px; line-height: 1.35; font-weight: 500; }
  .step i { width: 24px; height: 24px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center; }
  .foot { margin-top: auto; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .statusbar { min-height: 52px; padding: 0 18px; border-radius: 999px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dotx { width: 10px; height: 10px; border-radius: 999px; background: var(--amber-deep); box-shadow: 0 0 0 5px var(--amber-soft); animation: pulse 1.6s infinite; flex-shrink: 0; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(251,235,201,.4); } }
  @media (prefers-reduced-motion: reduce) { .dotx { animation: none; } }
  .linkbtn { background: none; border: none; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: underline; padding: 8px 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="hdr-bg"></div>
  <div class="wrap">
    <div style="padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between;color:#fff">
      <a id="back" href="/" aria-label="Kembali ke menu" style="width:44px;height:44px;border-radius:999px;background:var(--dark-2);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <span style="font-size:15px;font-weight:600">Pembayaran</span>
      <span id="mejaTag" style="height:32px;padding:0 12px;border-radius:999px;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center">Meja --</span>
    </div>
    <div style="position:relative;padding:22px 20px 0;display:flex;flex-direction:column;gap:4px;color:#fff">
      <span id="kodeLine" style="font-size:13px;color:#9DA19A">Total bayar</span>
      <span id="total" class="display" style="font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1">Rp0</span>
    </div>

    <div class="qr-card" id="card">
      <div style="align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span class="display" style="font-size:20px;font-weight:800;letter-spacing:1px">QRIS</span>
        <span id="merchant" class="muted" style="font-size:13px;font-weight:600"></span>
      </div>
      <div class="qr-box" id="qrBox" role="img" aria-label="Kode QR pembayaran"></div>
      <div style="align-self:stretch;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;font-size:13px"><span class="muted" id="timerLbl">Bayar sebelum waktu habis</span><span id="timer" class="num" style="font-weight:700">--:--</span></div>
        <div style="height:6px;border-radius:999px;background:#ECEBE6;overflow:hidden"><div id="bar" style="width:100%;height:6px;border-radius:999px;background:var(--ink);transition:width 1s linear"></div></div>
      </div>
    </div>

    <div class="steps" id="steps">
      <div class="step"><i>1</i>Buka e-wallet / m-banking</div>
      <div class="step"><i>2</i>Scan QR di atas</div>
      <div class="step"><i>3</i>Pesanan langsung ke dapur</div>
    </div>

    <div class="foot">
      <div class="statusbar">
        <span id="stat" style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600"><span class="dotx"></span>Menunggu pembayaran…</span>
        <button type="button" class="linkbtn" id="demo" hidden>demo: sudah bayar</button>
      </div>
      <button type="button" class="btn" id="save">Simpan gambar QR</button>
      <button type="button" class="linkbtn" id="cancel" style="align-self:center">Batalkan pesanan</button>
    </div>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = DK.q('o'), order = null, es = null, timer = null, total_s = 900;
  if (!token) { location.replace('/'); return; }
  $('back').href = '/' + (DK.getMeja() ? '?meja=' + encodeURIComponent(DK.getMeja()) : '');

  DK.api('/api/config').then(function (c) {
    $('merchant').textContent = c.nama_resto + ' · NMID ' + c.merchant_nmid;
    if (c.sim) $('demo').hidden = false;
  }).catch(function () {});

  function mmss(s) { s = Math.max(0, s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  function tick() {
    if (!order) return;
    var left = order.expires_at - Math.floor(Date.now() / 1000);
    $('timer').textContent = mmss(left);
    $('bar').style.width = Math.max(0, Math.min(100, (left / total_s) * 100)) + '%';
    if (left <= 0 && order.status === 'menunggu_bayar') refresh();
  }

  function render(o) {
    var first = !order;
    order = o;
    if (first) total_s = Math.max(60, o.expires_at - o.created_at);
    $('mejaTag').textContent = 'Meja ' + o.meja;
    $('total').textContent = DK.rp(o.total);
    $('kodeLine').textContent = 'Total bayar · #' + o.kode;

    if (o.status === 'baru' || o.status === 'dimasak' || o.status === 'siap' || o.status === 'selesai') {
      location.replace('/status?o=' + encodeURIComponent(token));
      return;
    }
    if (o.status === 'batal' || o.status === 'kedaluwarsa') {
      DK.setActiveOrder(null);
      $('card').innerHTML = '<div style="padding:28px 8px;text-align:center"><div class="display" style="font-size:24px;font-weight:800;margin-bottom:8px">' + (o.status === 'batal' ? 'Pesanan dibatalkan' : 'Waktu bayar habis') + '</div><p class="muted" style="margin:0 0 18px;font-size:14px;line-height:1.5">' + (o.status === 'batal' ? 'Pesanan ini sudah dibatalkan.' : 'Pesanan ini kedaluwarsa karena belum dibayar. Silakan pesan lagi.') + '</p><a class="btn" href="' + $('back').href + '">Kembali ke menu</a></div>';
      $('stat').innerHTML = 'Pesanan tidak aktif';
      $('save').hidden = $('cancel').hidden = $('demo').hidden = true;
      $('steps').hidden = true;
      if (es) es.close();
      return;
    }
    if (o.metode === 'tunai') {
      $('card').innerHTML = '<div style="align-self:stretch;text-align:center;padding:10px 0 6px"><div class="muted" style="font-size:13px;font-weight:600">Tunjukkan kode ini ke kasir</div><div class="display" style="font-size:44px;font-weight:800;letter-spacing:-1px;margin:10px 0">' + DK.esc(o.kode) + '</div><div class="muted" style="font-size:14px">Bayar ' + DK.rp(o.total) + ' tunai. Pesanan masuk dapur setelah kasir menerima uangmu.</div></div>';
      $('steps').hidden = true; $('save').hidden = true; $('demo').hidden = true;
      $('stat').innerHTML = '<span class="dotx"></span>Menunggu pembayaran di kasir…';
      return;
    }
    if (first) {
      $('qrBox').innerHTML = '<img alt="" src="/api/orders/' + encodeURIComponent(token) + '/qr.svg">';
    }
    tick();
  }

  function refresh() {
    return DK.api('/api/orders/' + encodeURIComponent(token)).then(render).catch(function (e) {
      if (e.status === 404) { DK.setActiveOrder(null); location.replace('/'); }
    });
  }

  refresh().then(function () {
    timer = setInterval(tick, 1000);
    setInterval(refresh, 4000); // cadangan kalau SSE terputus
    es = DK.watchOrder(token, { href: '/status?o=' + encodeURIComponent(token), onNotif: function (n) {
      if (n.tipe === 'pembayaran_berhasil' || n.tipe === 'pesanan_dibatalkan') refresh();
    } });
  });

  $('demo').addEventListener('click', function () {
    this.disabled = true;
    DK.api('/api/orders/' + encodeURIComponent(token) + '/simulate-pay', { method: 'POST', body: {} })
      .then(refresh).catch(function (e) { alert(e.message); $('demo').disabled = false; });
  });

  $('cancel').addEventListener('click', function () {
    if (!confirm('Batalkan pesanan ini?')) return;
    DK.api('/api/orders/' + encodeURIComponent(token) + '/batal', { method: 'POST', body: {} }).then(refresh).catch(function (e) { alert(e.message); });
  });

  $('save').addEventListener('click', function () {
    fetch('/api/orders/' + encodeURIComponent(token) + '/qr.svg').then(function (r) { return r.text(); }).then(function (svg) {
      var img = new Image(), url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      img.onload = function () {
        var c = document.createElement('canvas'), pad = 40, size = 720;
        c.width = c.height = size + pad * 2;
        var x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.imageSmoothingEnabled = false;
        x.drawImage(img, pad, pad, size, size);
        c.toBlob(function (b) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(b);
          a.download = 'qris-' + (order ? order.kode : 'pesanan') + '.png';
          a.click();
          URL.revokeObjectURL(url);
        });
      };
      img.src = url;
    });
  });
})();
</script>
</body>
</html>
