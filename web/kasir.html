<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layar Kasir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  .top { min-height: 76px; padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .pillw { height: 40px; padding: 0 16px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .main { padding: 0 28px 24px; display: flex; gap: 16px; align-items: flex-start; }
  .left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { padding: 16px 18px; border-radius: 22px; background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .stat span { font-size: 13px; color: var(--muted); } .stat b { font-family: var(--display); font-size: 24px; font-weight: 800; }
  .panelw { padding: 18px; border-radius: 26px; background: #fff; border: 1px solid var(--line); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-weight: 500; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .denah { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .mj { height: 66px; border-radius: 16px; border: none; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 12px; gap: 2px; text-align: left; }
  .mj b { font-size: 17px; font-weight: 800; } .mj span { font-size: 11px; font-weight: 600; }
  .mj.kosong { border: 1px dashed #C9C7BF; background: #fff; color: var(--muted); }
  .mj.masak { background: var(--amber); color: var(--ink); } .mj.makan { background: var(--ink); color: #fff; } .mj.bayar { background: var(--chili); color: #fff; }
  .mj.sel { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
  .orow { display: grid; grid-template-columns: 100px 70px minmax(0, 1fr) 100px 80px 150px; align-items: center; gap: 12px; min-height: 46px; padding: 6px 12px; border-radius: 14px; background: #F7F7F4; font-size: 14px; width: 100%; border: none; text-align: left; }
  .orow.sel { box-shadow: inset 0 0 0 2px var(--ink); }
  .side { width: 380px; flex-shrink: 0; padding: 22px; border-radius: 28px; background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; position: sticky; top: 12px; min-height: 560px; }
  .quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .quick button { height: 40px; border-radius: 12px; border: 1px solid var(--line); background: #F7F7F4; font-size: 13px; font-weight: 600; }
  @media (max-width: 1000px) { .main { flex-direction: column; padding: 0 16px 24px; } .side { width: 100%; position: static; } .stats { grid-template-columns: repeat(2, 1fr); } .orow { grid-template-columns: 90px 1fr 90px; } .orow .hide-s { display: none; } .top { padding: 12px 16px; } .denah { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<div class="top">
  <div class="row" style="gap:14px"><span class="display" style="font-size:26px;font-weight:800;letter-spacing:-.8px">dapurku.</span><span style="height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--lime);font-size:13px;font-weight:700;display:flex;align-items:center">Kasir</span></div>
  <div class="row" style="gap:10px;flex-wrap:wrap">
    <span class="pillw"><span class="muted" id="shift">Shift ·</span><span id="kasirNama">-</span></span>
    <button type="button" class="chip" id="tutup">Tutup shift</button>
    <span class="display num" id="clock" style="margin-left:8px;font-size:30px;font-weight:700">--.--</span>
  </div>
</div>
<div class="main">
  <div class="left">
    <div class="stats">
      <div class="stat" style="background:var(--ink);color:#fff;border-color:var(--ink)"><span style="color:#9DA19A">Masuk via QRIS</span><b id="sQris" style="color:var(--lime)">-</b></div>
      <div class="stat"><span>Tunai di laci</span><b id="sTunai">-</b></div>
      <div class="stat"><span>Pesanan aktif</span><b id="sAktif">-</b></div>
      <div class="stat" style="background:var(--red-soft);border-color:var(--red-soft)"><span style="color:var(--red-ink);font-weight:600">Menunggu bayar</span><b id="sWait" style="color:var(--red-ink)">-</b></div>
    </div>
    <section class="panelw" aria-label="Denah meja">
      <div class="row between" style="flex-wrap:wrap;gap:8px"><span style="font-size:16px;font-weight:700">Denah meja</span>
        <div class="legend"><span><i style="border:1px solid #C9C7BF"></i>Kosong</span><span><i style="background:var(--amber)"></i>Dimasak</span><span><i style="background:var(--ink)"></i>Sedang makan</span><span><i style="background:var(--chili)"></i>Menunggu bayar</span></div></div>
      <div class="denah" id="denah"></div>
    </section>
    <section class="panelw" aria-label="Pesanan terbaru" style="display:flex;flex-direction:column;gap:6px">
      <div class="row between" style="margin-bottom:6px;flex-wrap:wrap;gap:8px"><span style="font-size:16px;font-weight:700">Pesanan terbaru</span>
        <div class="row" style="gap:6px" id="filters"><button type="button" class="chip sm on" data-f="">Semua</button><button type="button" class="chip sm" data-f="belum">Belum bayar</button><button type="button" class="chip sm" data-f="lunas">Lunas</button></div></div>
      <div id="orders" style="display:flex;flex-direction:column;gap:6px"></div>
    </section>
  </div>
  <aside class="side" id="side" aria-label="Detail pesanan"><div class="muted" style="margin:auto;text-align:center">Pilih pesanan atau meja untuk melihat detail.</div></aside>
</div>

<script src="/js/common.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var filter = '', selId = null, orders = [], data = null, uang = null;
  var INFO = { kosong: 'Kosong', masak: 'Dimasak', makan: 'Makan', bayar: 'Belum bayar' };

  function clock() {
    var d = new Date(), h = d.getHours();
    $('clock').textContent = String(h).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');
    $('shift').textContent = 'Shift ' + (h < 11 ? 'pagi' : h < 17 ? 'siang' : 'malam') + ' ·';
  }
  clock(); setInterval(clock, 10000);

  function renderStats() {
    $('sQris').textContent = DK.rp(data.stat.qris); $('sTunai').textContent = DK.rp(data.stat.tunai);
    $('sAktif').textContent = data.stat.aktif; $('sWait').textContent = data.stat.menunggu;
    $('kasirNama').textContent = data.nama;
    var cur = orders.filter(function (o) { return o.id === selId; })[0];
    $('denah').innerHTML = data.meja.map(function (m) {
      var sel = cur && cur.meja === m.no ? ' sel' : '';
      return '<button type="button" class="mj ' + m.state + sel + '" data-m="' + DK.esc(m.no) + '" data-s="' + m.state + '"><b>' + DK.esc(m.no) + '</b><span>' + INFO[m.state] + (m.info ? ' · ' + DK.esc(m.info) : '') + '</span></button>';
    }).join('');
  }
  function renderOrders() {
    $('orders').innerHTML = orders.map(function (o) {
      var st;
      if (o.status === 'menunggu_bayar') st = '<span class="tag" style="background:var(--red-soft);color:var(--red-ink)">Belum bayar</span>';
      else if (o.status === 'batal') st = '<span class="tag" style="background:#eee;color:#555">Batal</span>';
      else if (o.status === 'kedaluwarsa') st = '<span class="tag" style="background:#eee;color:#555">Kedaluwarsa</span>';
      else st = '<span class="tag" style="background:var(--green-soft);color:var(--green-ink)">Lunas · ' + DK.jam(o.paid_at) + '</span>';
      return '<button type="button" class="orow' + (o.id === selId ? ' sel' : '') + '" data-o="' + o.id + '"><b>#' + DK.esc(o.kode) + '</b><span class="muted hide-s">Meja ' + DK.esc(o.meja) + '</span><span class="muted hide-s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + DK.esc(o.isi) + '</span><b style="text-align:right">' + DK.rp(o.total) + '</b><span class="tag hide-s" style="background:#fff;border:1px solid var(--line);font-weight:600;justify-self:start">' + (o.metode === 'qris' ? 'QRIS' : 'Tunai') + '</span>' + st + '</button>';
    }).join('') || '<p class="muted">Belum ada pesanan.</p>';
  }

  function nextCash(t) { var a = Math.ceil(t / 10000) * 10000; if (a === t) a += 10000; var b = Math.ceil((a + 1) / 50000) * 50000; if (b <= a) b = a + 50000; return [a, b]; }

  function renderSide(o) {
    var s = $('side');
    if (!o) { s.innerHTML = '<div class="muted" style="margin:auto;text-align:center">Pilih pesanan atau meja untuk melihat detail.</div>'; return; }
    var pending = o.status === 'menunggu_bayar';
    var tag = pending ? (o.metode === 'tunai' ? 'Bayar tunai' : 'Menunggu QRIS') : (o.status === 'batal' ? 'Dibatalkan' : o.status === 'kedaluwarsa' ? 'Kedaluwarsa' : 'Lunas · ' + (o.metode === 'tunai' ? 'tunai' : 'QRIS'));
    var tagc = pending ? 'background:var(--red-soft);color:var(--red-ink)' : (o.status === 'batal' || o.status === 'kedaluwarsa' ? 'background:#eee;color:#555' : 'background:var(--green-soft);color:var(--green-ink)');
    var h = '<div class="row between" style="align-items:flex-start;gap:8px"><div style="display:flex;flex-direction:column;gap:4px"><span class="display" style="font-size:30px;font-weight:800;letter-spacing:-1px">Meja ' + DK.esc(o.meja) + '</span><span class="muted" style="font-size:13px">#' + DK.esc(o.kode) + ' · dipesan ' + DK.jam(o.created_at) + '</span></div><span class="tag" style="padding:6px 12px;' + tagc + '">' + tag + '</span></div>';
    h += '<div style="display:flex;flex-direction:column;gap:10px;font-size:14px">' + o.items.map(function (i) {
      return '<div class="row between" style="gap:10px;align-items:flex-start"><span>' + i.qty + '× ' + DK.esc(i.nama) + (i.note ? ' <span class="muted">· ' + DK.esc(i.note) + '</span>' : '') + '</span><span style="font-weight:600;white-space:nowrap">' + DK.rp(i.subtotal) + '</span></div>';
    }).join('') + '<div style="height:1px;background:var(--line)"></div><div class="row between" style="align-items:baseline"><span style="font-weight:600">Total</span><span class="display" style="font-size:28px;font-weight:800">' + DK.rp(o.total) + '</span></div></div>';

    if (pending && o.metode === 'tunai') {
      var q = nextCash(o.total); if (uang == null) uang = q[1];
      var kb = uang - o.total;
      h += '<div><label class="lbl" for="uang">Uang diterima</label><input id="uang" class="field" inputmode="numeric" value="' + DK.rp(uang) + '" style="height:52px;border:2px solid var(--ink);font-size:20px;font-weight:700"><div class="quick" style="margin-top:8px"><button type="button" data-u="' + o.total + '">Uang pas</button><button type="button" data-u="' + q[0] + '">' + DK.rp(q[0]) + '</button><button type="button" data-u="' + q[1] + '">' + DK.rp(q[1]) + '</button></div></div>' +
        '<div class="row between" style="padding:14px 16px;border-radius:18px;background:' + (kb >= 0 ? 'var(--green-soft)' : 'var(--red-soft)') + ';color:' + (kb >= 0 ? 'var(--green-ink)' : 'var(--red-ink)') + '"><span style="font-size:14px;font-weight:600">' + (kb >= 0 ? 'Kembalian' : 'Kurang') + '</span><span class="display" style="font-size:26px;font-weight:800">' + DK.rp(Math.abs(kb)) + '</span></div>';
      h += '<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px"><button type="button" class="btn" style="height:56px" data-a="tunai"' + (kb < 0 ? ' disabled' : '') + '>Terima tunai &amp; kirim ke dapur</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn ghost" style="height:46px;font-size:14px" data-a="struk">Cetak struk</button><button type="button" class="btn danger" style="height:46px;font-size:14px" data-a="batal">Batalkan</button></div></div>';
    } else if (pending) {
      h += '<p class="muted" style="margin:0;font-size:13px;line-height:1.5">Menunggu pembayaran QRIS dari pelanggan. Kalau dana sudah masuk tapi status belum berubah, konfirmasi manual.</p><div style="margin-top:auto;display:flex;flex-direction:column;gap:8px"><button type="button" class="btn" style="height:56px" data-a="qris">Konfirmasi QRIS manual</button><button type="button" class="btn danger" style="height:46px;font-size:14px" data-a="batal">Batalkan</button></div>';
    } else {
      var acts = '<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">';
      if (o.status === 'siap') acts += '<button type="button" class="btn lime" style="height:56px" data-a="antar">Tandai sudah diantar</button>';
      if (o.status === 'selesai') acts += '<button type="button" class="btn" style="height:56px" data-a="kosong">Kosongkan meja ' + DK.esc(o.meja) + '</button>';
      acts += '<div style="display:grid;grid-template-columns:' + (o.status === 'baru' || o.status === 'dimasak' ? '1fr 1fr' : '1fr') + ';gap:8px"><button type="button" class="btn ghost" style="height:46px;font-size:14px" data-a="struk">Cetak struk</button>' + (o.status === 'baru' || o.status === 'dimasak' ? '<button type="button" class="btn danger" style="height:46px;font-size:14px" data-a="batal">Batalkan</button>' : '') + '</div></div>';
      h += (o.kembalian ? '<div class="row between muted" style="font-size:13px"><span>Diterima ' + DK.rp(o.uang_diterima) + '</span><span>Kembalian ' + DK.rp(o.kembalian) + '</span></div>' : '') + acts;
    }
    s.innerHTML = h;
  }

  function loadSide() {
    if (selId == null) return Promise.resolve();
    return DK.api('/api/staff/orders/' + selId).then(renderSide).catch(function () { renderSide(null); });
  }
  function select(id) { selId = id; uang = null; renderOrders(); loadSide(); if (data) renderStats(); }

  function load() {
    return Promise.all([DK.api('/api/staff/kasir'), DK.api('/api/staff/orders?limit=40&filter=' + filter)]).then(function (r) {
      data = r[0]; orders = r[1];
      if (selId == null && orders.length) {
        var w = orders.filter(function (o) { return o.status === 'menunggu_bayar' && o.metode === 'tunai'; })[0];
        selId = (w || orders[0]).id;
        loadSide();
      }
      renderStats(); renderOrders();
    }).catch(function (e) { if (e.status === 401 || e.status === 403) location.href = '/login?next=/kasir'; });
  }

  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters .chip').forEach(function (x) { x.classList.toggle('on', x === b); });
    load();
  });
  $('orders').addEventListener('click', function (e) { var b = e.target.closest('[data-o]'); if (b) select(+b.dataset.o); });
  $('denah').addEventListener('click', function (e) {
    var b = e.target.closest('[data-m]'); if (!b) return;
    if (b.dataset.s === 'kosong') return;
    DK.api('/api/staff/orders?limit=100').then(function (all) {
      var o = all.filter(function (x) { return x.meja === b.dataset.m && x.status !== 'batal' && x.status !== 'kedaluwarsa'; })[0];
      if (o) select(o.id);
    });
  });

  $('side').addEventListener('input', function (e) {
    if (e.target.id !== 'uang') return;
    var n = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0;
    uang = n;
    var pos = e.target.selectionStart; // render ulang hanya bagian kembalian
    loadSideKeepFocus();
  });
  function loadSideKeepFocus() {
    DK.api('/api/staff/orders/' + selId).then(function (o) {
      renderSide(o);
      var f = $('uang'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    });
  }
  $('side').addEventListener('click', function (e) {
    var u = e.target.closest('[data-u]'), a = e.target.closest('[data-a]');
    if (u) { uang = +u.dataset.u; loadSide(); return; }
    if (!a) return;
    var act = a.dataset.a, id = selId, p;
    if (act === 'struk') { window.open('/struk?id=' + id, '_blank'); return; }
    if (act === 'batal') { if (!confirm('Batalkan pesanan ini?')) return; p = DK.api('/api/staff/orders/' + id + '/batal', { body: {} }); }
    else if (act === 'tunai') p = DK.api('/api/staff/orders/' + id + '/bayar-tunai', { body: { uang: uang } });
    else if (act === 'qris') p = DK.api('/api/staff/orders/' + id + '/konfirmasi-qris', { body: {} });
    else if (act === 'antar') p = DK.api('/api/staff/orders/' + id + '/status', { body: { to: 'selesai' } });
    else if (act === 'kosong') { var m = a.textContent.replace(/\D/g, ''); p = DK.api('/api/staff/meja/' + encodeURIComponent(m) + '/kosongkan', { body: {} }); }
    if (!p) return;
    a.disabled = true;
    p.then(function () { uang = null; return load().then(loadSide); }).catch(function (er) { DK.toast({ judul: 'Gagal', isi: er.message }); a.disabled = false; });
  });

  $('tutup').addEventListener('click', function () {
    var bd = document.createElement('div');
    bd.className = 'modal-backdrop';
    bd.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="Tutup shift"><h2 class="display" style="margin:0 0 12px;font-size:26px">Tutup shift</h2>' +
      '<div style="display:flex;flex-direction:column;gap:10px;font-size:15px"><div class="row between"><span>Masuk via QRIS</span><b>' + DK.rp(data.stat.qris) + '</b></div><div class="row between"><span>Tunai di laci</span><b>' + DK.rp(data.stat.tunai) + '</b></div><div class="row between" style="border-top:1px solid var(--line);padding-top:10px"><span>Total hari ini</span><b>' + DK.rp(data.stat.qris + data.stat.tunai) + '</b></div></div>' +
      (data.stat.aktif + data.stat.menunggu ? '<p class="err" style="margin:14px 0 0;color:var(--red-ink);font-size:13px">Masih ada ' + data.stat.aktif + ' pesanan aktif dan ' + data.stat.menunggu + ' menunggu bayar.</p>' : '') +
      '<p class="muted" style="font-size:13px;margin:14px 0">Cocokkan uang di laci dengan angka tunai di atas sebelum keluar.</p><div class="row" style="gap:8px"><button type="button" class="btn ghost" style="flex:1" data-x>Batal</button><button type="button" class="btn" style="flex:1" data-out>Keluar</button></div></div>';
    bd.addEventListener('click', function (e) { if (e.target === bd || e.target.closest('[data-x]')) bd.remove(); else if (e.target.closest('[data-out]')) DK.logout(); });
    document.body.appendChild(bd);
  });

  DK.requireLogin().then(function (me) {
    if (me.role !== 'kasir' && me.role !== 'admin') { location.href = '/login?next=/kasir'; return; }
    load(); setInterval(function () { load().then(function () { if (!document.activeElement || document.activeElement.id !== 'uang') loadSide(); }); }, 6000);
    DK.listen('/api/staff/events', function (n) {
      DK.chime(); DK.toast({ judul: n.judul, isi: n.isi });
      load().then(function () { if (!document.activeElement || document.activeElement.id !== 'uang') loadSide(); });
    });
  });
})();
</script>
</body>
</html>
