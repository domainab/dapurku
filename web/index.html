<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Dapurku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  .menu-top { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px; padding-bottom: 120px; }
  .meja-chip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
  .meja-chip .dot { width: 28px; height: 28px; border-radius: 999px; background: var(--lime); display: flex; align-items: center; justify-content: center; }
  .brand { font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
  h1.hero-title { margin: 0; font-family: var(--display); font-size: 32px; line-height: 1.05; font-weight: 800; letter-spacing: -1px; }
  .hero { position: relative; height: 148px; border-radius: 28px; background: var(--ink); color: #fff; padding: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
  .hero .photo { position: absolute; right: -24px; top: 14px; width: 150px; height: 150px; border-radius: 999px; background: var(--dark-2); display: flex; align-items: center; justify-content: center; color: #9DA19A; font-size: 12px; font-weight: 600; overflow: hidden; }
  .hero .photo img, .card .photo img { width: 100%; height: 100%; object-fit: cover; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  .card { display: flex; flex-direction: column; gap: 8px; }
  .card .photo { position: relative; height: 150px; border-radius: 24px; background: var(--photo); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; font-weight: 600; overflow: hidden; }
  .card .add { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 999px; border: none; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s; }
  .card .add.ok { background: var(--lime); color: var(--ink); }
  .card .badge { position: absolute; left: 10px; top: 10px; padding: 4px 8px; border-radius: 999px; background: #fff; color: var(--chili); font-size: 11px; font-weight: 700; }
  .card .qty { position: absolute; left: 10px; bottom: 10px; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--lime); color: var(--ink); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .card .name { font-size: 15px; font-weight: 600; } .card .price { font-size: 15px; font-weight: 700; }
  .card.habis .name, .card.habis .price { color: var(--muted); }
  .card .habis-pill { padding: 6px 12px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; }
  .cart-bar { position: fixed; left: 16px; right: 16px; bottom: 20px; max-width: 398px; margin: 0 auto; height: 64px; padding: 0 8px 0 10px; border-radius: 999px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 12px 30px rgba(17,19,17,.28); z-index: 20; }
  .cart-bar .left { display: flex; align-items: center; gap: 12px; background: none; border: none; color: inherit; padding: 0; text-align: left; }
  .cart-bar .cnt { width: 44px; height: 44px; border-radius: 999px; background: var(--lime); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; }
  .cart-bar .go { height: 48px; padding: 0 20px; border-radius: 999px; background: #fff; color: var(--ink); border: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: 20px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; }
  .banner b { color: var(--lime); }
  .search { height: 44px; border-radius: 999px; border: 1px solid var(--line); background: #fff; padding: 0 18px; font-size: 15px; width: 100%; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .line .opt { font-size: 12px; color: var(--muted); grid-column: 1; }
  .stepper { height: 44px; padding: 0 4px; border-radius: 999px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; }
  .stepper button { width: 36px; height: 36px; border-radius: 999px; border: none; background: transparent; font-size: 20px; font-weight: 600; }
  .stepper span { min-width: 20px; text-align: center; font-weight: 700; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
  .seg button { height: 44px; border-radius: 999px; border: none; background: transparent; font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .meja-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .meja-grid button { height: 56px; border-radius: 16px; border: 1px solid var(--line); background: #fff; font-size: 17px; font-weight: 700; }
  .err { color: var(--red-ink); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="menu-top">
    <div class="row between">
      <button type="button" class="meja-chip" id="mejaBtn" aria-label="Ganti nomor meja">
        <span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111311" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16M6 9v10M18 9v10M9 9V6h6v3"></path></svg></span>
        <span id="mejaLbl">Meja --</span>
      </button>
      <span class="brand" id="brand">dapurku.</span>
      <button type="button" class="icon-btn" id="searchBtn" aria-label="Cari menu"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></button>
    </div>
    <input id="searchBox" class="search" type="search" placeholder="Cari menu…" aria-label="Cari menu" hidden>
    <a id="banner" class="banner" href="#" hidden></a>
    <h1 class="hero-title">Lapar? Pesan langsung dari meja.</h1>
    <a id="hero" class="hero" href="#" hidden></a>
    <div id="chips" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px" role="tablist" aria-label="Kategori"></div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </div>

  <div class="cart-bar" id="cartBar" hidden>
    <button type="button" class="left" id="cartOpen" aria-label="Lihat keranjang">
      <span class="cnt" id="cartCnt">0</span>
      <span style="display:flex;flex-direction:column"><span style="font-size:12px;color:#9DA19A">Total</span><span style="font-size:17px;font-weight:700" id="cartTotal">Rp0</span></span>
    </button>
    <button type="button" class="go" id="checkoutBtn">Checkout <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
(function () {
  var menu = null, kat = 'Semua', cari = '';
  var $ = function (id) { return document.getElementById(id); };
  var metode = DK.ls.get('dk.metode', 'qris');

  DK.api('/api/config').then(function (c) { $('brand').textContent = c.nama_resto.toLowerCase() + '.'; document.title = 'Menu ' + c.nama_resto; }).catch(function () {});

  /* ----- meja ----- */
  function renderMeja() { var m = DK.getMeja(); $('mejaLbl').textContent = m ? 'Meja ' + m : 'Pilih meja'; }
  function pickMeja() {
    DK.api('/api/meja').then(function (list) {
      var bd = document.createElement('div');
      bd.className = 'sheet-backdrop';
      bd.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Pilih nomor meja"><h2 class="display" style="margin:0 0 4px;font-size:24px">Kamu duduk di meja berapa?</h2><p class="muted" style="margin:0 0 16px;font-size:14px">Nomor ada di stiker atau tulisan di mejamu.</p><div class="meja-grid">' +
        list.map(function (n) { return '<button type="button" data-no="' + DK.esc(n) + '">' + DK.esc(n) + '</button>'; }).join('') + '</div></div>';
      bd.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-no]');
        if (b) { DK.setMeja(b.dataset.no); renderMeja(); bd.remove(); }
        else if (e.target === bd && DK.getMeja()) bd.remove();
      });
      document.body.appendChild(bd);
    });
  }
  $('mejaBtn').addEventListener('click', pickMeja);
  renderMeja();
  if (!DK.getMeja()) pickMeja();

  /* ----- menu ----- */
  function simple(m) { return !m.pedas && m.extras.length === 0; }
  function photo(m, fallback) { return m.foto_url ? '<img src="' + DK.esc(m.foto_url) + '" alt="">' : fallback; }

  function renderHero() {
    var h = $('hero'), t = menu.terlaris;
    if (!t) { h.hidden = true; return; }
    var n = DK.cart.qtyOf(t.id);
    h.hidden = false;
    h.href = '/detail?id=' + t.id;
    h.setAttribute('aria-label', 'Lihat ' + t.nama);
    h.innerHTML = '<div class="photo">' + photo(t, '[FOTO]') + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:6px;position:relative;max-width:200px"><span style="align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--lime);color:var(--ink);font-size:11px;font-weight:700">Terlaris hari ini</span>' +
      '<span class="display" style="font-size:22px;font-weight:700;line-height:1.1">' + DK.esc(t.nama) + '</span></div>' +
      '<div style="display:flex;align-items:center;gap:12px;position:relative"><span style="font-size:16px;font-weight:700">' + DK.rp(t.harga) + '</span>' +
      (n ? '<span style="padding:4px 10px;border-radius:999px;background:var(--dark-2);color:var(--lime);font-size:12px;font-weight:600">' + n + ' di keranjang</span>' : '') + '</div>';
  }

  function renderChips() {
    var cats = ['Semua'].concat(menu.kategori);
    $('chips').innerHTML = cats.map(function (c) {
      return '<button type="button" class="chip' + (c === kat ? ' on' : '') + '" data-k="' + DK.esc(c) + '" role="tab" aria-selected="' + (c === kat) + '">' + DK.esc(c) + '</button>';
    }).join('');
  }

  function renderGrid() {
    var q = cari.trim().toLowerCase();
    var items = menu.items.filter(function (m) {
      return (kat === 'Semua' || m.kategori === kat) && (!q || m.nama.toLowerCase().indexOf(q) >= 0);
    });
    if (!items.length) { $('grid').innerHTML = '<p class="muted" style="grid-column:1/-1">Menu tidak ditemukan.</p>'; return; }
    $('grid').innerHTML = items.map(function (m) {
      var n = DK.cart.qtyOf(m.id);
      var inner = m.tersedia ? photo(m, '[FOTO]') : '<span class="habis-pill">Habis</span>';
      var badge = m.tersedia && m.pedas ? '<span class="badge">Pedas</span>' : '';
      var qty = m.tersedia && n ? '<span class="qty">' + n + '×</span>' : '';
      var add = '';
      if (m.tersedia) {
        add = simple(m)
          ? '<button type="button" class="add" data-add="' + m.id + '" aria-label="Tambah ' + DK.esc(m.nama) + '">' + DK.icons.plus + '</button>'
          : '<a class="add" href="/detail?id=' + m.id + '" aria-label="Atur dan tambah ' + DK.esc(m.nama) + '">' + DK.icons.plus + '</a>';
      }
      var link = m.tersedia ? 'href="/detail?id=' + m.id + '"' : '';
      return '<div class="card' + (m.tersedia ? '' : ' habis') + '">' +
        '<div class="photo">' + (m.tersedia ? '<a ' + link + ' aria-label="Lihat ' + DK.esc(m.nama) + '" style="position:absolute;inset:0"></a>' : '') + inner + badge + qty + add + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:2px;padding:0 4px"><span class="name">' + DK.esc(m.nama) + '</span><span class="price">' + DK.rp(m.harga) + '</span></div></div>';
    }).join('');
  }

  function renderBar() {
    var c = DK.cart.count();
    $('cartBar').hidden = c === 0;
    $('cartCnt').textContent = c;
    $('cartTotal').textContent = DK.rp(DK.cart.total());
    if (menu) { renderHero(); renderGrid(); }
  }

  $('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) { kat = b.dataset.k; renderChips(); renderGrid(); } });
  $('searchBtn').addEventListener('click', function () { var b = $('searchBox'); b.hidden = !b.hidden; if (!b.hidden) b.focus(); else { cari = ''; b.value = ''; renderGrid(); } });
  $('searchBox').addEventListener('input', function (e) { cari = e.target.value; renderGrid(); });
  $('grid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-add]');
    if (!b) return;
    var m = menu.items.filter(function (x) { return x.id === +b.dataset.add; })[0];
    DK.cart.add({ menu_id: m.id, nama: m.nama, harga: m.harga, qty: 1, level: null, extras: [], extraNames: [], catatan: '' });
    b.classList.add('ok'); setTimeout(function () { b.classList.remove('ok'); }, 450);
  });
  window.addEventListener('dk:cart', renderBar);
  window.addEventListener('pageshow', renderBar);

  DK.api('/api/menu').then(function (m) { menu = m; renderChips(); renderBar(); })
    .catch(function () { $('grid').innerHTML = '<p class="err" style="grid-column:1/-1">Menu belum bisa dimuat. Coba muat ulang halaman.</p>'; });

  /* ----- keranjang & checkout ----- */
  function optText(l) {
    var p = [];
    if (l.level != null) p.push('Level ' + l.level);
    if (l.extraNames && l.extraNames.length) p.push('+ ' + l.extraNames.join(', '));
    if (l.catatan) p.push('“' + l.catatan + '”');
    return p.join(' · ');
  }

  function checkout(btn, errEl) {
    var meja = DK.getMeja();
    if (!meja) { pickMeja(); return; }
    var lines = DK.cart.lines();
    if (!lines.length) return;
    btn.disabled = true;
    DK.api('/api/orders', { body: {
      meja: meja, metode: metode,
      items: lines.map(function (l) { return { menu_id: l.menu_id, qty: l.qty, level: l.level, extras: l.extras, catatan: l.catatan }; })
    } }).then(function (r) {
      DK.cart.clear();
      DK.setActiveOrder({ token: r.token, kode: r.order.kode });
      location.href = (r.order.metode === 'tunai' ? '/status' : '/bayar') + '?o=' + encodeURIComponent(r.token);
    }).catch(function (e) {
      btn.disabled = false;
      if (errEl) errEl.textContent = e.message; else alert(e.message);
    });
  }
  $('checkoutBtn').addEventListener('click', function () { checkout(this); });

  function openCart() {
    var bd = document.createElement('div');
    bd.className = 'sheet-backdrop';
    function paint() {
      var lines = DK.cart.lines();
      if (!lines.length) { bd.remove(); return; }
      bd.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Keranjang"><div class="row between" style="margin-bottom:6px"><h2 class="display" style="margin:0;font-size:26px">Keranjang</h2><button type="button" class="icon-btn" data-close aria-label="Tutup">' + DK.icons.close + '</button></div>' +
        lines.map(function (l, i) {
          return '<div class="line"><div><div style="font-weight:600;font-size:15px">' + DK.esc(l.nama) + '</div>' + (optText(l) ? '<div class="opt">' + DK.esc(optText(l)) + '</div>' : '') + '<div style="font-size:14px;font-weight:700;margin-top:2px">' + DK.rp(l.harga * l.qty) + '</div></div>' +
            '<div class="stepper"><button type="button" data-dec="' + i + '" aria-label="Kurangi">−</button><span>' + l.qty + '</span><button type="button" data-inc="' + i + '" aria-label="Tambah">+</button></div></div>';
        }).join('') +
        '<div style="margin:16px 0 8px;font-size:13px;font-weight:600" class="muted">Bayar pakai</div>' +
        '<div class="seg"><button type="button" data-m="qris" aria-pressed="' + (metode === 'qris') + '">QRIS</button><button type="button" data-m="tunai" aria-pressed="' + (metode === 'tunai') + '">Tunai di kasir</button></div>' +
        '<div class="row between" style="margin:18px 0 12px"><span style="font-weight:600">Total</span><span class="display" style="font-size:28px;font-weight:800">' + DK.rp(DK.cart.total()) + '</span></div>' +
        '<div class="err" id="cartErr" role="alert"></div>' +
        '<button type="button" class="btn" style="width:100%;height:56px" data-go>Checkout ' + DK.icons.arrow + '</button></div>';
    }
    bd.addEventListener('click', function (e) {
      var t = e.target, lines = DK.cart.lines();
      if (t === bd || t.closest('[data-close]')) { bd.remove(); return; }
      var inc = t.closest('[data-inc]'), dec = t.closest('[data-dec]'), m = t.closest('[data-m]');
      if (inc) DK.cart.setQty(+inc.dataset.inc, lines[+inc.dataset.inc].qty + 1);
      else if (dec) DK.cart.setQty(+dec.dataset.dec, lines[+dec.dataset.dec].qty - 1);
      else if (m) { metode = m.dataset.m; DK.ls.set('dk.metode', metode); paint(); }
      else if (t.closest('[data-go]')) checkout(t.closest('[data-go]'), document.getElementById('cartErr'));
    });
    window.addEventListener('dk:cart', paint);
    paint();
    document.body.appendChild(bd);
  }
  $('cartOpen').addEventListener('click', openCart);

  /* ----- banner pesanan aktif + notifikasi ----- */
  var ao = DK.activeOrder();
  if (ao && ao.token) {
    DK.api('/api/orders/' + encodeURIComponent(ao.token)).then(function (o) {
      var aktif = ['menunggu_bayar', 'baru', 'dimasak', 'siap'].indexOf(o.status) >= 0;
      if (!aktif) { DK.setActiveOrder(null); return; }
      var b = $('banner');
      b.hidden = false;
      b.href = (o.status === 'menunggu_bayar' && o.metode === 'qris' ? '/bayar' : '/status') + '?o=' + encodeURIComponent(ao.token);
      b.innerHTML = '<span>Pesanan <b>#' + DK.esc(o.kode) + '</b> sedang berjalan</span><span style="display:flex;align-items:center;gap:6px">Lihat status ' + DK.icons.arrow + '</span>';
      DK.watchOrder(ao.token, { href: b.href });
    }).catch(function () { DK.setActiveOrder(null); });
  }
})();
</script>
</body>
</html>
