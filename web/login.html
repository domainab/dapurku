<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk staf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  main { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  form { width: min(400px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .err { color: var(--red-ink); font-size: 13px; font-weight: 600; min-height: 18px; }
</style>
</head>
<body>
<main>
  <form id="f">
    <div><span class="display" style="font-size:26px;font-weight:800;letter-spacing:-.8px">dapurku.</span><div class="muted" style="font-size:14px;margin-top:2px">Masuk untuk staf</div></div>
    <div><label class="lbl" for="u">Username</label><input id="u" class="field" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required></div>
    <div><label class="lbl" for="p">Password</label><input id="p" class="field" type="password" autocomplete="current-password" maxlength="200" required></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" type="submit" id="go">Masuk</button>
  </form>
</main>
<script src="/js/common.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var HOME = { kasir: '/kasir', dapur: '/dapur', admin: '/admin' };
  $('u').value = DK.ls.get('dk.username', '');
  if ($('u').value) $('p').focus();
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    $('err').textContent = '';
    $('go').disabled = true;
    DK.api('/api/login', { body: { username: $('u').value, password: $('p').value } }).then(function (r) {
      DK.ls.set('dk.username', r.username);
      var next = DK.q('next');
      location.href = next && next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : HOME[r.role];
    }).catch(function (er) {
      $('go').disabled = false;
      $('err').textContent = er.message;
      $('p').value = '';
      $('p').focus();
    });
  });
})();
</script>
</body>
</html>
